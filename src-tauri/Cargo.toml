[package]
name = "ifuyo-tide"
version = "1.2.1"
license = "MIT OR Apache-2.0"
description = "ifuyo Tide — local-first downloader and progressive media player"
edition = "2021"

[lib]
name = "ifuyo_tide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
librqbit = { version = "9.0.1", features = ["disable-upload"] }
# M0.5 SPIKE: async runtime for the local experiments
# (fixture HTTP server, gateway, FileStream reads).
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs"] }
sha2 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["default-tls", "stream", "http2"] }
url = "2.5.8"
bytes = { version = "1.12.1", default-features = false }
futures-util = { version = "0.3.34", default-features = false }

[profile.release]
strip = true
lto = "thin"
