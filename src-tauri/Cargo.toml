[package]
name = "ifuyo-tide"
version = "0.1.0"
description = "ifuyo Tide — local-first downloader and progressive media player"
edition = "2021"

[lib]
name = "ifuyo_tide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
librqbit = "9.0.1"
# M0.5 SPIKE: async runtime for the local experiments
# (fixture HTTP server, gateway, FileStream reads).
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }

[profile.release]
strip = true
lto = "thin"
